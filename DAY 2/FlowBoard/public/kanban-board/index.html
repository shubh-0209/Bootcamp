<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kanban Task Board — Plan, Track &amp; Ship Work</title>
    <meta
      name="description"
      content="A fast, accessible Kanban task board with native drag &amp; drop, priorities, due dates and offline-ready local storage."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kanban Task Board — Plan, Track &amp; Ship Work" />
    <meta
      property="og:description"
      content="Organise work across To Do, In Progress and Done with native HTML5 drag &amp; drop."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <a class="skip-link" href="#board">Skip to board</a>

    <header class="app-header">
      <div class="shell header-inner">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">K</span>
          <div class="brand-text">
            <h1>Kanban Board</h1>
            <p id="todayDate" class="brand-date"></p>
          </div>
        </div>
        <nav class="header-actions" aria-label="Board actions">
          <button type="button" class="btn btn-ghost" id="clearDoneBtn">Clear done</button>
          <button type="button" class="btn btn-primary" id="addTaskBtn">
            <span aria-hidden="true">+</span> New task
          </button>
        </nav>
      </div>
    </header>

    <main class="shell">
      <section class="quote" aria-labelledby="quoteHeading">
        <h2 id="quoteHeading" class="sr-only">Motivational quote</h2>
        <div class="quote-body">
          <p id="quoteText" class="quote-text" aria-live="polite">Loading a quote…</p>
          <p id="quoteAuthor" class="quote-author"></p>
        </div>
        <button type="button" class="btn btn-soft" id="newQuoteBtn">New quote</button>
      </section>

      <section id="board" class="board" aria-label="Kanban board">
        <!-- Columns rendered by ui.js -->
      </section>
    </main>

    <footer class="app-footer">
      <div class="shell footer-inner">
        <p>Built with HTML5, CSS3 &amp; vanilla JavaScript.</p>
        <p id="statsLine" class="muted"></p>
      </div>
    </footer>

    <button type="button" id="backToTop" class="back-to-top" aria-label="Back to top">↑</button>

    <!-- Task modal (add / edit) -->
    <div class="overlay" id="taskOverlay" hidden>
      <div
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="taskModalTitle"
        id="taskModal"
      >
        <h2 id="taskModalTitle">New task</h2>
        <form id="taskForm" novalidate>
          <div class="field">
            <label for="taskTitle">Title</label>
            <input id="taskTitle" name="title" type="text" required maxlength="80" />
            <p class="error" id="titleError" hidden>Please enter a title.</p>
          </div>
          <div class="field">
            <label for="taskDescription">Description</label>
            <textarea id="taskDescription" name="description" rows="3" maxlength="400"></textarea>
          </div>
          <div class="grid-2">
            <div class="field">
              <label for="taskPriority">Priority</label>
              <select id="taskPriority" name="priority">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
              </select>
            </div>
            <div class="field">
              <label for="taskDueDate">Due date</label>
              <input id="taskDueDate" name="dueDate" type="date" />
            </div>
          </div>
          <div class="grid-2">
            <div class="field">
              <label for="taskCategory">Category</label>
              <input id="taskCategory" name="category" type="text" maxlength="24" placeholder="Design" />
            </div>
            <div class="field">
              <label for="taskStatus">Column</label>
              <select id="taskStatus" name="status">
                <option value="todo">To Do</option>
                <option value="progress">In Progress</option>
                <option value="done">Done</option>
              </select>
            </div>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" data-close-modal>Cancel</button>
            <button type="submit" class="btn btn-primary" id="taskSubmitBtn">Save task</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Delete confirmation -->
    <div class="overlay" id="confirmOverlay" hidden>
      <div
        class="modal modal-sm"
        role="alertdialog"
        aria-modal="true"
        aria-labelledby="confirmTitle"
        aria-describedby="confirmDesc"
        id="confirmModal"
      >
        <h2 id="confirmTitle">Delete task?</h2>
        <p id="confirmDesc" class="muted">This action can't be undone.</p>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-close-modal>Cancel</button>
          <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
        </div>
      </div>
    </div>

    <div id="liveRegion" class="sr-only" role="status" aria-live="polite"></div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
